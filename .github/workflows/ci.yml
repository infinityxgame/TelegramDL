name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests, vet y build del panel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install

      - name: Generate Wails bindings
        run: wails3 generate bindings -d dashboard/src/bindings

      # El panel se compila antes que go vet: main.go hace
      # //go:embed all:dashboard/dist y necesita esa carpeta con contenido.
      - name: Build dashboard
        working-directory: dashboard
        run: pnpm run build

      - name: go vet
        run: go vet ./...

      # -race solo se ejecuta en Linux porque ahí el runner trae gcc;
      # en local (Windows sin gcc) el detector de carreras no compila.
      # -count=1 evita reutilizar la caché de resultados de los tests.
      - name: go test
        run: go test -race -count=1 ./...
