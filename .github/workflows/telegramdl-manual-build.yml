name: Manual TelegramDL Build

run-name: "TelegramDL | ${{ inputs.source_branch }} | ${{ inputs.target_os }}"

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Repositorio que contiene la rama que se va a compilar"
        required: true
        type: string
        default: "mcampver/TelegramDL"
      source_branch:
        description: "Rama que se va a compilar"
        required: true
        type: string
        default: "feat/downloads-history-sort"
      target_os:
        description: "Sistema operativo de destino"
        required: true
        type: choice
        options:
          - all
          - windows
          - linux
          - macos-intel
          - macos-arm64
        default: all
      app_version:
        description: "Versión personalizada (vacío = conservar la versión de esa rama)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Select target systems
        id: matrix
        shell: bash
        env:
          TARGET_OS: ${{ inputs.target_os }}
        run: |
          case "$TARGET_OS" in
            all)
              TARGETS='[
                {"name":"Windows","runner":"windows-latest","platform":"windows"},
                {"name":"Linux x86_64","runner":"ubuntu-24.04","platform":"linux"},
                {"name":"macOS Intel","runner":"macos-15-intel","platform":"macos-intel"},
                {"name":"macOS Apple Silicon","runner":"macos-15","platform":"macos-arm64"}
              ]'
              ;;
            windows)
              TARGETS='[{"name":"Windows","runner":"windows-latest","platform":"windows"}]'
              ;;
            linux)
              TARGETS='[{"name":"Linux x86_64","runner":"ubuntu-24.04","platform":"linux"}]'
              ;;
            macos-intel)
              TARGETS='[{"name":"macOS Intel","runner":"macos-15-intel","platform":"macos-intel"}]'
              ;;
            macos-arm64)
              TARGETS='[{"name":"macOS Apple Silicon","runner":"macos-15","platform":"macos-arm64"}]'
              ;;
            *)
              echo "Sistema operativo no vÃ¡lido: $TARGET_OS"
              exit 1
              ;;
          esac

          echo "targets=$(echo "$TARGETS" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target.name }}
    needs: prepare
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}

    steps:
      - name: Checkout selected source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install Linux build dependencies
        if: matrix.target.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev \
            fuse \
            libfuse2

      - name: Install Wails CLI
        shell: bash
        run: |
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Resolve and optionally set application version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(sed -nE 's/^[[:space:]]*AppVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pkg/config/config.go | head -n 1)"

          if [ -z "$CURRENT_VERSION" ]; then
            echo "No se pudo detectar AppVersion en pkg/config/config.go"
            exit 1
          fi

          if [ -n "${REQUESTED_VERSION//[[:space:]]/}" ]; then
            VERSION="${REQUESTED_VERSION#v}"

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "VersiÃ³n no vÃ¡lida: $REQUESTED_VERSION"
              echo "Usa un formato como 2.7.5 o 2.7.5-beta.1"
              exit 1
            fi

            echo "Aplicando versiÃ³n personalizada: $VERSION"
            go run scripts/setversion.go "$VERSION"
          else
            VERSION="$CURRENT_VERSION"
            echo "No se indicÃ³ versiÃ³n. Se conserva la versiÃ³n de la rama: $VERSION"
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "La compilaciÃ³n usarÃ¡ TelegramDL $VERSION"

      - name: Build Windows ZIP
        if: matrix.target.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          wails3 task build
          test -f build/bin/TelegramDL.exe
          mkdir -p dist
          cp build/bin/TelegramDL.exe dist/
          7z a "TelegramDL-Windows-${{ steps.version.outputs.value }}.zip" ./dist/TelegramDL.exe

      - name: Build Linux AppImage
        if: matrix.target.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          wails3 task linux:create:appimage
          shopt -s nullglob
          files=(build/bin/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No se encontrÃ³ ningÃºn AppImage en build/bin"
            find build/bin -maxdepth 1 -type f -print
            exit 1
          fi
          cp "${files[0]}" "TelegramDL-Linux-x86_64-${{ steps.version.outputs.value }}.AppImage"

      - name: Build macOS DMG
        if: startsWith(matrix.target.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          wails3 task darwin:package:dmg
          shopt -s nullglob
          files=(build/bin/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No se encontrÃ³ ningÃºn DMG en build/bin"
            find build/bin -maxdepth 2 -type f -print
            exit 1
          fi

          if [ "${{ matrix.target.platform }}" = "macos-intel" ]; then
            LABEL="Intel"
          else
            LABEL="Apple-Silicon"
          fi

          cp "${files[0]}" "TelegramDL-macOS-${LABEL}-${{ steps.version.outputs.value }}.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDL-${{ matrix.target.platform }}-${{ steps.version.outputs.value }}
          path: |
            TelegramDL-*.zip
            TelegramDL-*.AppImage
            TelegramDL-*.dmg
          if-no-files-found: error
          retention-days: 7
