name: Build and Release TGDown

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # =========================
          # WINDOWS
          # =========================
          - platform: Windows
            os: windows-latest
            artifact_name: TelegramDL-Windows
            asset_extension: .zip

          # =========================
          # LINUX
          # =========================
          - platform: Linux
            os: ubuntu-latest
            artifact_name: TelegramDL-Linux
            asset_extension: .tar.gz

          # =========================
          # macOS INTEL
          # =========================
          - platform: macOS-Intel
            os: macos-15-intel
            artifact_name: TelegramDL-macOS-Intel
            asset_extension: .dmg
            macos_arch: x86_64

          # =========================
          # macOS APPLE SILICON
          # =========================
          - platform: macOS-ARM64
            os: macos-15
            artifact_name: TelegramDL-macOS-ARM64
            asset_extension: .dmg
            macos_arch: arm64

    steps:
      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # VERSION INFORMATION
      # ==================================================

      - name: Set version information
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRODUCT_NAME=TGDown" >> "$GITHUB_ENV"
          echo "PRODUCT_DESCRIPTION=Descarga y gestiona archivos multimedia de Telegram" >> "$GITHUB_ENV"
          echo "COMPANY_NAME=InfinityxGame" >> "$GITHUB_ENV"

      # ==================================================
      # NODE.JS
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ==================================================
      # BUILD VUE DASHBOARD
      # ==================================================

      - name: Build Vue Dashboard
        run: |
          cd dashboard
          npm install
          npm run build
          cd ..

      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ==================================================
      # PYTHON DEPENDENCIES
      # ==================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ==================================================
      # WINDOWS VERSION INFORMATION
      # ==================================================

      - name: Create Windows version information
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $VERSION = "${{ env.VERSION }}"
          $VERSION_PARTS = $VERSION.Split('.')

          $MAJOR = [int]$VERSION_PARTS[0]
          $MINOR = if ($VERSION_PARTS.Length -gt 1) { [int]$VERSION_PARTS[1] } else { 0 }
          $PATCH = if ($VERSION_PARTS.Length -gt 2) { [int]$VERSION_PARTS[2] } else { 0 }

          @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($MAJOR, $MINOR, $PATCH, 0),
              prodvers=($MAJOR, $MINOR, $PATCH, 0),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo(
                [
                  StringTable(
                    u'040904B0',
                    [
                      StringStruct(u'CompanyName', u'InfinityxGame'),
                      StringStruct(u'FileDescription', u'Descarga y gestiona archivos multimedia de Telegram'),
                      StringStruct(u'FileVersion', u'$VERSION'),
                      StringStruct(u'InternalName', u'TelegramDL'),
                      StringStruct(u'LegalCopyright', u'Copyright © 2026 InfinityxGame'),
                      StringStruct(u'OriginalFilename', u'TelegramDL.exe'),
                      StringStruct(u'ProductName', u'TGDown'),
                      StringStruct(u'ProductVersion', u'$VERSION')
                    ]
                  )
                ]
              ),
              VarFileInfo(
                [
                  VarStruct(u'Translation', [1033, 1200])
                ]
              )
            ]
          )
          "@ | Out-File -Encoding utf8 version_info.txt

      # ==================================================
      # WINDOWS BUILD
      # ==================================================

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --onedir `
            --noconsole `
            --icon="icon.ico" `
            --version-file="version_info.txt" `
            --name "TelegramDL" `
            --add-data "dashboard/dist;dashboard/dist" `
            TelegramDL.py

          Compress-Archive `
            -Path dist/TelegramDL/* `
            -DestinationPath "${{ matrix.artifact_name }}-${{ github.ref_name }}.zip"

      # ==================================================
      # LINUX BUILD
      # ==================================================

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --onedir \
            --name "TelegramDL" \
            --add-data "dashboard/dist:dashboard/dist" \
            TelegramDL.py

      # ==================================================
      # LINUX DESKTOP INFORMATION
      # ==================================================

      - name: Create Linux desktop information
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat > dist/TelegramDL/TGDown.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=TGDown
          Comment=Descarga y gestiona archivos multimedia de Telegram
          Exec=TelegramDL
          Terminal=false
          Categories=Network;Utility;
          X-AppVersion=${VERSION}
          EOF

      # ==================================================
      # LINUX PORTABLE PACKAGE
      # ==================================================

      - name: Create Linux portable package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czvf \
            "${{ matrix.artifact_name }}-${{ github.ref_name }}.tar.gz" \
            -C dist/TelegramDL .

      # ==========================================
      # CREATE macOS ICON
      # ==========================================

      - name: Create macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Creating macOS ICNS icon from icon.png..."

          rm -rf Icon.iconset
          mkdir -p Icon.iconset

          sips -z 16 16 \
            icon.png \
            --out Icon.iconset/icon_16x16.png

          sips -z 32 32 \
            icon.png \
            --out Icon.iconset/icon_16x16@2x.png

          sips -z 32 32 \
            icon.png \
            --out Icon.iconset/icon_32x32.png

          sips -z 64 64 \
            icon.png \
            --out Icon.iconset/icon_32x32@2x.png

          sips -z 128 128 \
            icon.png \
            --out Icon.iconset/icon_128x128.png

          sips -z 256 256 \
            icon.png \
            --out Icon.iconset/icon_128x128@2x.png

          sips -z 256 256 \
            icon.png \
            --out Icon.iconset/icon_256x256.png

          sips -z 512 512 \
            icon.png \
            --out Icon.iconset/icon_256x256@2x.png

          sips -z 512 512 \
            icon.png \
            --out Icon.iconset/icon_512x512.png

          sips -z 1024 1024 \
            icon.png \
            --out Icon.iconset/icon_512x512@2x.png

          iconutil \
            -c icns \
            Icon.iconset \
            -o icon.icns

          echo "macOS icon created successfully"

          ls -lh icon.icns

      # ==================================================
      # macOS BUILD
      # ==================================================

      - name: Build macOS App with PyInstaller
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Building macOS application for architecture: ${{ matrix.macos_arch }}"

          pyinstaller \
            --noconfirm \
            --onedir \
            --windowed \
            --target-arch "${{ matrix.macos_arch }}" \
            --osx-bundle-identifier "com.infinityxgame.tgdown" \
            --name "TelegramDL" \
            --add-data "dashboard/dist:dashboard/dist" \
            TelegramDL.py

      # ==================================================
      # macOS APPLICATION INFORMATION
      # ==================================================

      - name: Add macOS application information
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PLIST="dist/TelegramDL.app/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName TGDown" \
            "$PLIST" || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleName string TGDown" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName TGDown" \
            "$PLIST" || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string TGDown" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString ${VERSION}" \
            "$PLIST" || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleShortVersionString string ${VERSION}" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion ${VERSION}" \
            "$PLIST" || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleVersion string ${VERSION}" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier com.infinityxgame.tgdown" \
            "$PLIST" || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIdentifier string com.infinityxgame.tgdown" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSHumanReadableCopyright string Copyright © 2026 InfinityxGame" \
            "$PLIST" || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSHumanReadableDescription string Descarga y gestiona archivos multimedia de Telegram" \
            "$PLIST" || true

      # ==================================================
      # macOS ARCHITECTURE CHECK
      # ==================================================

      - name: Check macOS architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Expected architecture: ${{ matrix.macos_arch }}"
          file "dist/TelegramDL.app/Contents/MacOS/TelegramDL"

      # ==================================================
      # macOS AD-HOC SIGNING
      # ==================================================

      - name: Ad-Hoc Sign macOS App
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign \
            --force \
            --deep \
            --sign - \
            "dist/TelegramDL.app"

      # ==================================================
      # VERIFY macOS SIGNATURE
      # ==================================================

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "dist/TelegramDL.app"

      # ==================================================
      # VERIFY macOS ARCHITECTURE AFTER SIGNING
      # ==================================================

      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Final application architecture:"
          file "dist/TelegramDL.app/Contents/MacOS/TelegramDL"

          echo ""
          echo "Code signature:"
          codesign \
            --display \
            --verbose=4 \
            "dist/TelegramDL.app" 2>&1 || true

      # ==================================================
      # CREATE macOS DMG
      # ==================================================

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf dmg
          mkdir dmg

          cp -R "dist/TelegramDL.app" dmg/

          ln -s /Applications dmg/Applications

          hdiutil create \
            -volname "TGDown" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            "${{ matrix.artifact_name }}-${{ github.ref_name }}.dmg"

      # ==================================================
      # UPLOAD RELEASE ASSET
      # ==================================================

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}-${{ github.ref_name }}${{ matrix.asset_extension }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}