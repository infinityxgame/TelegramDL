name: Build and Release TGDown

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Build application with Wails
        shell: bash
        run: wails build -clean -platform windows/amd64 -s -o TelegramDL -webview2 download

      - name: Package Windows
        shell: bash
        run: |
          mkdir -p dist_win
          BIN_PATH=""
          if [ -f "build/bin/TelegramDL.exe" ]; then
            BIN_PATH="build/bin/TelegramDL.exe"
          elif [ -f "build/bin/TelegramDL" ]; then
            BIN_PATH="build/bin/TelegramDL"
          elif [ -f "build/bin/TGDown.exe" ]; then
            BIN_PATH="build/bin/TGDown.exe"
          elif [ -f "build/bin/TGDown" ]; then
            BIN_PATH="build/bin/TGDown"
          elif [ -f "build/bin/tgdown.exe" ]; then
            BIN_PATH="build/bin/tgdown.exe"
          else
            echo "Error: Binary not found in build/bin"
            ls -la build/bin
            exit 1
          fi
          cp "$BIN_PATH" dist_win/TelegramDL.exe
          powershell -NoProfile -NonInteractive -Command "Compress-Archive -Path 'dist_win/*' -DestinationPath 'TGDown-Windows-${{ github.ref_name }}.zip' -Force"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: TGDown-Windows-${{ github.ref_name }}.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Build application with Wails
        shell: bash
        run: wails build -clean -platform linux/amd64 -s -o TGDown -webview2 download

      - name: Package Linux
        shell: bash
        run: tar -czf "TGDown-Linux-x86_64-${{ github.ref_name }}.tar.gz" -C build/bin TGDown

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux x86_64
          path: TGDown-Linux-x86_64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Build application with Wails
        shell: bash
        run: wails build -clean -platform darwin/universal -s -o TGDown -webview2 download

      - name: Package macOS
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/TGDown.app "TGDown-macOS-Universal-${{ github.ref_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS Universal
          path: TGDown-macOS-Universal-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
