name: Build and Release TGDown

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Tests y vet antes de compilar
    runs-on: ubuntu-22.04
    # Solo lectura: este job únicamente hace checkout, compila y ejecuta tests.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      # El panel se compila antes que go vet: main.go hace
      # //go:embed all:dashboard/dist y necesita esa carpeta con contenido.
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    # Solo lectura: checkout y subida de artefactos; upload-artifact no necesita más.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Build application with Wails
        shell: bash
        run: wails build -clean -platform windows/amd64 -s -o TelegramDL -webview2 download

      - name: Package Windows
        shell: bash
        run: |
          mkdir -p dist_win
          BIN_PATH=""
          if [ -f "build/bin/TelegramDL.exe" ]; then
            BIN_PATH="build/bin/TelegramDL.exe"
          elif [ -f "build/bin/TelegramDL" ]; then
            BIN_PATH="build/bin/TelegramDL"
          elif [ -f "build/bin/TGDown.exe" ]; then
            BIN_PATH="build/bin/TGDown.exe"
          elif [ -f "build/bin/TGDown" ]; then
            BIN_PATH="build/bin/TGDown"
          elif [ -f "build/bin/tgdown.exe" ]; then
            BIN_PATH="build/bin/tgdown.exe"
          else
            echo "Error: Binary not found in build/bin"
            ls -la build/bin
            exit 1
          fi
          cp "$BIN_PATH" dist_win/TelegramDL.exe
          powershell -NoProfile -NonInteractive -Command "Compress-Archive -Path 'dist_win/*' -DestinationPath 'TGDown-Windows-${{ github.ref_name }}.zip' -Force"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: TGDown-Windows-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux x86_64
    needs: test
    runs-on: ubuntu-22.04
    # Solo lectura: checkout y subida de artefactos; upload-artifact no necesita más.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Build application with Wails
        shell: bash
        run: wails build -clean -platform linux/amd64 -s -o TelegramDL -webview2 download

      - name: Package Linux
        shell: bash
        run: tar -czf "TGDown-Linux-x86_64-${{ github.ref_name }}.tar.gz" -C build/bin TelegramDL

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux x86_64
          path: TGDown-Linux-x86_64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build macOS Universal
    needs: test
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Build application with Wails
        shell: bash
        run: |
          wails build -clean -platform darwin/universal -s -o TelegramDL -webview2 download
          chmod +x build/bin/TelegramDL.app/Contents/MacOS/TelegramDL

      - name: Package macOS
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/TelegramDL.app "TGDown-macOS-Universal-${{ github.ref_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS Universal
          path: TGDown-macOS-Universal-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1
          
  release:
    name: Publish Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    # contents: write para crear la release y subir los assets (softprops/action-gh-release);
    # actions: write para que github-script pueda eliminar los artefactos del run.
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      # La aplicación exige este archivo antes de instalar nada: sin él, una
      # descarga manipulada sería indistinguible de la legítima. Si se quita de
      # aquí, las actualizaciones automáticas dejan de funcionar a propósito.
      #
      # SEC-11: este checksums.txt da integridad, NO autenticidad —se publica
      # desde el mismo origen que los binarios—, así que un runner o token
      # comprometido podría publicar artefactos y checksums coherentes. La
      # firma criptográfica (minisign/sigstore) queda pendiente como decisión
      # abierta. Además, por la misma cadena de suministro: los builds de aquí
      # NO deben llevar nunca `-tags dev` (SEC-39), que desactiva comprobaciones
      # de seguridad en los binarios distribuidos.
      - name: Generate checksums
        run: |
          cd release_assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        # Se fija por SHA en lugar de un tag movible (@master) para que un tag
        # comprometido en el upstream no pueda colar código con el token del bot.
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            🚀 <b>¡Nueva versión de TelegramDL publicada!</b>

            📦 <b>Versión:</b> <code>${{ github.ref_name }}</code>
            🔗 <b>Enlace:</b> https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

      ####################################################################
      # Política de 0 retención: elimina inmediatamente todos los artefactos
      # temporales de la compilación para mantener el almacenamiento en 0 MB
      ####################################################################
      - name: Delete temporary build artifacts (Zero Retention)
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const res = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of res.data.artifacts) {
              console.log(`Eliminando artefacto temporal: ${artifact.name} (ID: ${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

