name: Build and Release TGDown

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Tests y vet antes de compilar
    runs-on: ubuntu-24.04
    # Solo lectura: este job únicamente hace checkout, compila y ejecuta tests.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Wails CLI
        shell: bash
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install

      - name: Generate Wails bindings
        shell: bash
        run: CGO_ENABLED=0 wails3 generate bindings -d dashboard/src/bindings

      # El panel se compila antes que go vet: main.go hace
      # //go:embed all:dashboard/dist y necesita esa carpeta con contenido.
      - name: Build dashboard
        working-directory: dashboard
        run: pnpm run build

      - name: go vet
        run: CGO_ENABLED=0 go vet -tags purego ./...

      - name: go test
        run: CGO_ENABLED=0 go test -tags purego ./...

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    # Solo lectura: checkout y subida de artefactos; upload-artifact no necesita más.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Wails CLI
        shell: bash
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install

      - name: Generate Wails bindings
        shell: bash
        run: wails3 generate bindings -d dashboard/src/bindings

      - name: Build dashboard
        working-directory: dashboard
        run: pnpm run build

      - name: Build application with Wails
        shell: bash
        run: wails3 build

      - name: Package Windows
        shell: bash
        run: |
          mkdir -p dist_win
          BIN_PATH=""
          if [ -f "build/bin/TelegramDL.exe" ]; then
            BIN_PATH="build/bin/TelegramDL.exe"
          elif [ -f "build/bin/TelegramDL" ]; then
            BIN_PATH="build/bin/TelegramDL"
          elif [ -f "build/bin/TGDown.exe" ]; then
            BIN_PATH="build/bin/TGDown.exe"
          elif [ -f "build/bin/TGDown" ]; then
            BIN_PATH="build/bin/TGDown"
          elif [ -f "build/bin/tgdown.exe" ]; then
            BIN_PATH="build/bin/tgdown.exe"
          else
            echo "Error: Binary not found in build/bin"
            ls -la build/bin
            exit 1
          fi
          cp "$BIN_PATH" dist_win/TelegramDL.exe
          powershell -NoProfile -NonInteractive -Command "Compress-Archive -Path 'dist_win/*' -DestinationPath 'TGDown-Windows-${{ github.ref_name }}.zip' -Force"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: TGDown-Windows-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux x86_64
    needs: test
    runs-on: ubuntu-24.04
    # Solo lectura: checkout y subida de artefactos; upload-artifact no necesita más.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Install Wails CLI
        shell: bash
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install

      - name: Generate Wails bindings
        shell: bash
        run: CGO_ENABLED=0 wails3 generate bindings -d dashboard/src/bindings

      - name: Build dashboard
        working-directory: dashboard
        run: pnpm run build

      - name: Build application with Wails
        shell: bash
        run: wails3 build

      - name: Package Linux
        shell: bash
        run: tar -czf "TGDown-Linux-x86_64-${{ github.ref_name }}.tar.gz" -C build/bin TelegramDL

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux x86_64
          path: TGDown-Linux-x86_64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build macOS Universal
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Wails CLI
        shell: bash
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install

      - name: Generate Wails bindings
        shell: bash
        run: CGO_ENABLED=0 wails3 generate bindings -d dashboard/src/bindings

      - name: Build dashboard
        working-directory: dashboard
        run: pnpm run build

      # Actualiza la versión en Info.plist e Info.dev.plist con el tag del release
      - name: Update macOS version in Info.plist
        shell: bash
        run: |
          RAW_VERSION="${{ github.ref_name }}"
          VERSION="${RAW_VERSION#v}"
          echo "Setting macOS version to: $VERSION"
          plutil -replace CFBundleVersion -string "$VERSION" build/darwin/Info.plist
          plutil -replace CFBundleShortVersionString -string "$VERSION" build/darwin/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" build/darwin/Info.dev.plist
          plutil -replace CFBundleShortVersionString -string "$VERSION" build/darwin/Info.dev.plist

      - name: Build application with Wails (Universal Binary)
        shell: bash
        run: |
          wails3 task darwin:build:universal
          
          # Garantizar la estructura del bundle .app con Info.plist y recursos
          APP_DIR="build/bin/TelegramDL.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          
          if [ -f "build/bin/TelegramDL" ]; then
            mv "build/bin/TelegramDL" "$APP_DIR/Contents/MacOS/TelegramDL"
          fi
          
          if [ -f "build/darwin/Info.plist" ]; then
            cp "build/darwin/Info.plist" "$APP_DIR/Contents/Info.plist"
          fi
          
          if [ -f "build/darwin/icons.icns" ]; then
            cp "build/darwin/icons.icns" "$APP_DIR/Contents/Resources/icons.icns"
          fi
          
          if [ -f "$APP_DIR/Contents/MacOS/TelegramDL" ]; then
            chmod +x "$APP_DIR/Contents/MacOS/TelegramDL"
          fi

          codesign --force --deep --sign - "$APP_DIR" || true

      - name: Package macOS
        shell: bash
        run: |
          if [ -d "build/bin/TelegramDL.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent build/bin/TelegramDL.app "TGDown-macOS-Universal-${{ github.ref_name }}.zip"
          else
            cd build/bin && zip -r "../../TGDown-macOS-Universal-${{ github.ref_name }}.zip" . && cd ../..
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS Universal
          path: TGDown-macOS-Universal-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    # contents: write para crear la release y subir los assets (softprops/action-gh-release);
    # actions: write para que github-script pueda eliminar los artefactos del run.
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      # La aplicación exige este archivo antes de instalar nada: sin él, una
      # descarga manipulada sería indistinguible de la legítima. Si se quita de
      # aquí, las actualizaciones automáticas dejan de funcionar a propósito.
      #
      # SEC-11: este checksums.txt da integridad, NO autenticidad —se publica
      # desde el mismo origen que los binarios—, así que un runner o token
      # comprometido podría publicar artefactos del origen legítimo. La
      # firma criptográfica (minisign/sigstore) queda pendiente como decisión
      # abierta. Además, por la misma cadena de suministro: los builds de aquí
      # NO deben llevar nunca `-tags dev` (SEC-39), que desactiva comprobaciones
      # de seguridad en los binarios distribuidos.
      - name: Generate checksums
        run: |
          cd release_assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        # Se fija por SHA en lugar de un tag movible (@master) para que un tag
        # comprometido en el upstream no pueda colar código con el token del bot.
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: html
          message: |
            🚀 <b>¡Nueva versión de TelegramDL publicada!</b>

            📦 <b>Versión:</b> <code>${{ github.ref_name }}</code>
            🔗 <b>Enlace:</b> https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

      ####################################################################
      # Política de 0 retención: elimina inmediatamente todos los artefactos
      # temporales de la compilación para mantener el almacenamiento en 0 MB
      ####################################################################
      - name: Delete temporary build artifacts (Zero Retention)
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const res = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of res.data.artifacts) {
              console.log(`Eliminando artefacto temporal: ${artifact.name} (ID: ${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
