name: Build and Release TGDown

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build executable on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: TelegramDL-Windows
            asset_extension: .zip
          - os: ubuntu-latest
            artifact_name: TelegramDL-Linux
            asset_extension: .tar.gz
          - os: macos-latest
            artifact_name: TelegramDL-macOS
            asset_extension: .tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Vue Dashboard
        run: |
          cd dashboard
          npm install
          npm run build
          cd ..

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --noconsole --icon="icon.ico" --name "TelegramDL" --add-data "dashboard/dist;dashboard/dist" TelegramDL.py
          Compress-Archive -Path dist/TelegramDL/* -DestinationPath "${{ matrix.artifact_name }}-${{ github.ref_name }}.zip"

      - name: Build with PyInstaller (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onedir --name "TelegramDL" --add-data "dashboard/dist:dashboard/dist" TelegramDL.py
          tar -czvf "${{ matrix.artifact_name }}-${{ github.ref_name }}.tar.gz" -C dist/TelegramDL .

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}-${{ github.ref_name }}${{ matrix.asset_extension }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
